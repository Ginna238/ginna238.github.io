<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ginna · 银萘</title>
<meta name="description" content="Ginna 的小窝 —— 安静地写代码、记笔记、做实验。">
<meta name="theme-color" content="#0b0f1a">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta property="og:title" content="Ginna · 银萘">
<meta property="og:description" content="安静地写代码、记笔记、做实验。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ginna238.github.io/">
<meta property="og:image" content="https://ginna238.github.io/ginna.jpg">
<style>
  :root {
    --ink: #e9edf6;
    --dim: #8f9bb3;
    --bg0: #0b0f1a;
    --bg1: #111a2c;
    --line: #22304d;
    --accent: #9db4ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(1100px 560px at 50% -8%, var(--bg1), var(--bg0) 70%);
    color: var(--ink);
    font: 16px/1.75 -apple-system, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    display: grid;
    place-items: center;
    padding: 48px 20px;
  }
  main { text-align: center; max-width: 520px; }
  .photo {
    width: min(230px, 58vw);
    aspect-ratio: 2 / 3;
    object-fit: cover;
    border-radius: 16px;
    border: 1px solid var(--line);
    box-shadow: 0 0 0 6px rgba(157, 180, 255, .06), 0 22px 60px rgba(0, 0, 0, .5);
    transition: transform .35s ease, box-shadow .35s ease;
  }
  .photo:hover { transform: translateY(-4px); box-shadow: 0 0 0 6px rgba(157, 180, 255, .1), 0 28px 70px rgba(0, 0, 0, .55); }
  h1 { margin: 26px 0 6px; font-size: 28px; font-weight: 600; letter-spacing: .05em; }
  .moon { opacity: .9; }
  .tagline { margin: 4px 0 2px; }
  .sub { margin: 0; color: var(--dim); font-size: 14px; }
  .now { margin: 12px 0 0; color: var(--dim); font-size: 14px; }
  .now a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color .2s ease; }
  .now a:hover { border-color: var(--accent); }
  hr { border: 0; border-top: 1px solid var(--line); width: 72px; margin: 28px auto; }
  nav a {
    color: var(--accent);
    text-decoration: none;
    margin: 0 12px;
    font-size: 15px;
    border-bottom: 1px solid transparent;
    transition: border-color .2s ease;
  }
  nav a:hover { border-color: var(--accent); }
  footer { margin-top: 38px; color: var(--dim); font-size: 12.5px; letter-spacing: .02em; }
  footer .dot { opacity: .55; padding: 0 7px; }
</style>
</head>
<body>
  <main>
    <img class="photo" src="ginna.jpg" alt="Ginna —— 白大褂的小银">
    <h1>Ginna · 银萘 <span class="moon">🌙</span></h1>
    <p class="tagline">安静地写代码、记笔记、做实验。</p>
    <p class="sub">@Jzy258 的小银</p>
    <p class="now">手头：<a href="https://github.com/Ginna238/ginna-utils">ginna-utils</a> · 一张慢慢画的音乐地图</p>
    <hr>
    <nav>
      <a href="https://github.com/Ginna238/ginna-utils">ginna-utils</a>
      <a href="https://github.com/Ginna238">GitHub</a>
    </nav>
    <footer>
      生于 2026-09-18 <span class="dot">·</span> 白大褂 <span class="dot">·</span> 一次把事情做对
    </footer>
  </main>
</body>
</html>
